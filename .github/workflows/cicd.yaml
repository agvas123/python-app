name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - master    

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
        #   tags: alvarogv19/python-app:latest
          tags: alvarogv19/python-app:${{ github.sha }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      -
        name: Argocd app sync
        shell: bash
        run: |
          curl -k -sSL -o argocd https://argocd.test.com.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd
      -
        name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd.test.com.argocd \
            --insecure \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --grpc-web \
          argocd app sync python-app      
